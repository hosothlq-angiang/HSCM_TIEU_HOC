<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Hệ thống Hồ sơ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #fbbc04; margin-bottom: 20px; }
        .info { background: #fef7e0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-warning { background: #fbbc04; color: #202124; }
        .btn-secondary { background: #e8eaed; color: #5f6368; text-decoration: none; text-align: center; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔑 Đặt lại mật khẩu</h2>
        
        <div class="info">
            <strong>Người dùng:</strong> {{ target_user.full_name }}<br>
            <strong>Tên đăng nhập:</strong> {{ target_user.username }}<br>
            <strong>Email:</strong> {{ target_user.email }}
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label>Mật khẩu mới *</label>
                <input type="password" name="new_password" required placeholder="Nhập mật khẩu mới">
            </div>
            
            <p style="font-size:13px; color:#5f6368; margin:10px 0;">
                ⚠️ Giáo viên sẽ bị yêu cầu đổi mật khẩu lại khi đăng nhập tiếp theo.
            </p>
            
            <button type="submit" class="btn btn-warning">Xác nhận đặt lại</button>
            <a href="{{ url_for('main.manage_users') }}" class="btn btn-secondary">Quay lại</a>
        </form>
    </div>
</body>
</html>
