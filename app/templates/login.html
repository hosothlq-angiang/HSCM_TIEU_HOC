<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Hồ sơ Chuyên môn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #d2e3fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 420px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-header h1 {
            font-size: 22px;
            color: #202124;
            margin-bottom: 5px;
        }
        .login-header p {
            color: #5f6368;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #3c4043;
            font-size: 14px;
        }
        .input-wrapper {
            position: relative;
        }
        input {
            width: 100%;
            padding: 12px 45px 12px 14px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }
        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #5f6368;
            padding: 0;
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn-login:hover {
            background: #1557b0;
        }
        .flash {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }
        .flash-error {
            background: #fce8e6;
            color: #d93025;
            border-left: 4px solid #d93025;
        }
        .forgot-link {
            text-align: center;
            margin-top: 18px;
        }
        .forgot-link a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
        }
        .forgot-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <h1>🔐 Hệ thống Đăng nhập</h1>
            <p>Quản lý Hồ sơ Chuyên môn — Tiểu học</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=false) %}
        {% if messages %}
            {% for msg in messages %}
            <div class="flash flash-error">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" required placeholder="Nhập tên đăng nhập" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu" autocomplete="current-password">
                    <button type="button" class="toggle-pw" id="togglePw" aria-label="Hiện mật khẩu">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="forgot-link">
            <a href="{{ url_for('main.forgot_password') }}">Quên mật khẩu?</a>
        </div>
    </div>

    <script>
        const pwInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePw');
        
        toggleBtn.addEventListener('click', function() {
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                toggleBtn.textContent = '🙈';
                toggleBtn.setAttribute('aria-label', 'Ẩn mật khẩu');
            } else {
                pwInput.type = 'password';
                toggleBtn.textContent = '👁️';
                toggleBtn.setAttribute('aria-label', 'Hiện mật khẩu');
            }
        });
    </script>
</body>
</html>
