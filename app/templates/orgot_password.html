<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Hệ thống Hồ sơ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #5f6368; margin-bottom: 25px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .radio-group { display: flex; gap: 20px; margin-bottom: 16px; }
        .radio-option { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: center; }
        .radio-option.active { border-color: #1a73e8; background: #e8f0fe; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-secondary { background: #e8eaed; color: #5f6368; text-decoration: none; text-align: center; display: block; margin-top: 10px; }
        .flash { padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .flash-success { background: #e6f4ea; color: #137333; }
        .flash-error { background: #fce8e6; color: #d93025; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔓 Quên mật khẩu</h2>
        
        {% with messages = get_flashed_messages(with_categories=false) %}
        {% if messages %}
            {% for msg in messages %}
            <div class="flash {% if '✅' in msg %}flash-success{% elif '❌' in msg %}flash-error{% endif %}">
                {{ msg }}
            </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST" id="forgotForm">
            <div class="form-group">
                <label>Chọn cách nhận hướng dẫn:</label>
                <div class="radio-group">
                    <label class="radio-option active" data-type="email">
                        <input type="radio" name="contact_type" value="email" checked style="display:none;">
                        📧 Qua Email
                    </label>
                    <label class="radio-option" data-type="phone">
                        <input type="radio" name="contact_type" value="phone" style="display:none;">
                        📱 Qua Điện thoại
                    </label>
                </div>
            </div>
            
            <div class="form-group" id="inputField">
                <label>Email đã đăng ký</label>
                <input type="email" name="contact_value" required placeholder="nhapemail@gmail.com">
            </div>
            
            <button type="submit" class="btn btn-primary">Gửi hướng dẫn</button>
            <a href="{{ url_for('main.login') }}" class="btn btn-secondary">Quay lại đăng nhập</a>
        </form>
    </div>

    <script>
        const options = document.querySelectorAll('.radio-option');
        const inputField = document.getElementById('inputField');
        const input = inputField.querySelector('input');
        
        options.forEach(opt => {
            opt.addEventListener('click', () => {
                options.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                const type = opt.dataset.type;
                document.querySelector(`input[name="contact_type"][value="${type}"]`).checked = true;
                
                if (type === 'email') {
                    inputField.innerHTML = `<label>Email đã đăng ký</label><input type="email" name="contact_value" required placeholder="nhapemail@gmail.com">`;
                } else {
                    inputField.innerHTML = `<label>Số điện thoại đã đăng ký</label><input type="tel" name="contact_value" required placeholder="09xxxxxxxxx">`;
                }
            });
        });
    </script>
</body>
</html>
