<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo tài khoản mới</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f8f9fa; padding: 30px; max-width: 500px; margin: 0 auto; }
        h1 { color: #202124; margin-bottom: 25px; font-size: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #3c4043; font-size: 14px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid #dadce0; border-radius: 8px; font-size: 15px; }
        input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1557b0; }
        .back-link { display: inline-block; margin-top: 18px; color: #5f6368; text-decoration: none; font-size: 14px; }
        .flash { padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .flash-error { background: #fce8e6; color: #d93025; border-left: 4px solid #d93025; }
    </style>
</head>
<body>
    <h1>➕ Tạo tài khoản giáo viên</h1>

    {% with messages = get_flashed_messages(with_categories=false) %}
    {% if messages %}
        {% for msg in messages %}
        <div class="flash flash-error">{{ msg }}</div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Tên đăng nhập *</label>
            <input type="text" id="username" name="username" required placeholder="vd: nguyenthib">
        </div>
        <div class="form-group">
            <label for="full_name">Họ và tên *</label>
            <input type="text" id="full_name" name="full_name" required placeholder="Nguyễn Thị B">
        </div>
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="nguyenthib@gmail.com">
        </div>
        <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input type="text" id="phone" name="phone" placeholder="Tùy chọn">
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu ban đầu *</label>
            <input type="password" id="password" name="password" required placeholder="Ít nhất 8 ký tự">
        </div>
        <button type="submit">Tạo tài khoản</button>
    </form>

    <a href="{{ url_for('main.manage_users') }}" class="back-link">← Quay lại danh sách</a>
</body>
</html>
