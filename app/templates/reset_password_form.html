<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .card{background:white;padding:35px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);width:100%;max-width:420px}
        h2{text-align:center;color:#202124;margin-bottom:20px}
        .form-group{margin-bottom:18px}
        label{display:block;margin-bottom:6px;font-weight:bold;color:#5f6368;font-size:14px}
        input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
        input:focus{outline:none;border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.1)}
        .btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
        .btn-primary{background:#1a73e8;color:white}
        .hint{font-size:13px;color:#666;margin-top:6px}
        .flash{padding:12px;border-radius:8px;margin-bottom:20px}
        .flash-error{background:#fce8e6;color:#d93025;border-left:4px solid #d93025}
        .flash-success{background:#e6f4ea;color:#137333;border-left:4px solid #137333}
    </style>
</head>
<body>
    <div class="card">
        <h2>🔑 Đặt mật khẩu mới</h2>
        {% with m=get_flashed_messages(with_categories=true) %}
            {% if m %}{% for c,msg in m %}<div class="flash flash-{{c}}">{{msg}}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="new_password" required>
                <p class="hint">Ít nhất 6 ký tự + phải chứa @ hoặc #</p>
            </div>
            <div class="form-group">
                <label>Nhập lại mật khẩu mới</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Lưu mật khẩu mới</button>
        </form>
    </div>
</body>
</html>
