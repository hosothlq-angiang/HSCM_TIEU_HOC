<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Hồ sơ Chuyên môn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #4285f4, #34a853); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 40px; max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #202124; font-size: 24px; margin-bottom: 10px; }
        .subtitle { color: #5f6368; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; margin: 10px 0; transition: 0.3s; }
        .btn-primary { background: #4285f4; color: white; }
        .btn-primary:hover { background: #3367d6; }
        .btn-drive { background: #34a853; color: white; }
        .btn-drive:hover { background: #2d9347; }
        .status { margin-top: 20px; color: #34a853; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Hệ thống Quản lý Hồ sơ Chuyên môn</h1>
        <p class="subtitle">Trực tuyến & Kết nối Google Drive</p>
        
        <a href="{{ url_for('main.login') }}" class="btn btn-primary">🔐 Đăng nhập Hệ thống</a>
        <a href="{{ drive_link }}" target="_blank" class="btn btn-drive">📁 Mở Thư mục Dữ liệu</a>
        
        <p class="status">Đã kết nối thành công!</p>
    </div>
</body>
</html>
