<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .card{background:white;padding:35px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);width:100%;max-width:420px}
        h2{text-align:center;color:#202124;margin-bottom:8px}
        .sub{text-align:center;color:#5f6368;margin-bottom:25px;font-size:14px}
        .form-group{margin-bottom:18px}
        label{display:block;margin-bottom:6px;font-weight:bold;color:#5f6368;font-size:14px}
        input, select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
        input:focus, select:focus{outline:none;border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.1)}
        .btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
        .btn-primary{background:#1a73e8;color:white}
        .btn-secondary{background:#e8eaed;color:#5f6368;margin-top:12px;text-align:center;text-decoration:none;display:block}
        .flash{padding:12px;border-radius:8px;margin-bottom:20px;line-height:1.6}
        .flash-success{background:#e6f4ea;color:#137333;border-left:4px solid #137333}
        .flash-error{background:#fce8e6;color:#d93025;border-left:4px solid #d93025}
        .flash-info{background:#e8f0fe;color:#1a73e8;border-left:4px solid #1a73e8}
        .note{font-size:13px;color:#666;margin-top:6px}
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Quên mật khẩu</h2>
        <p class="sub">Chọn cách nhận hướng dẫn đặt lại mật khẩu</p>
        
        {% with m=get_flashed_messages(with_categories=true) %}
            {% if m %}{% for c,msg in m %}<div class="flash flash-{{c}}">{{msg}}</div>{% endfor %}{% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="form-group">
                <label>Email hoặc Số điện thoại đã đăng ký</label>
                <input type="text" name="contact" required placeholder="email@gmail.com hoặc 09xxxxxxxxx">
            </div>
            
            <div class="form-group">
                <label>Phương thức nhận hướng dẫn</label>
                <select name="method">
                    <option value="email">📧 Gửi về Gmail (Ưu tiên)</option>
                    <option value="phone">📞 Xác minh qua Số điện thoại</option>
                </select>
                <p class="note">Gmail nhận liên kết đặt lại ngay • SĐT liên hệ Admin cấp mật khẩu mới</p>
            </div>
            
            <button type="submit" class="btn btn-primary">Gửi yêu cầu</button>
            <a href="{{url_for('main.login')}}" class="btn btn-secondary">← Quay lại đăng nhập</a>
        </form>
    </div>
</body>
</html>
